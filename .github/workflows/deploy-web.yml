name: Deploy web

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "pathagon/**"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: pathagon-web-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify durable data
        run: npm run test:data

      - name: Verify web app
        run: npm run test:ci --workspace @pathagon/web

      - name: Verify Rust engine
        run: npm run test:rust

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Resolve production database
        id: database
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          d1_list="$RUNNER_TEMP/pathagon-d1.json"
          npx wrangler d1 list --json > "$d1_list"
          database_id="$(jq -r '.[] | select(.name == "pathagon-web") | (.uuid // .id // empty)' "$d1_list" | head -n 1)"

          if [ -z "$database_id" ]; then
            npx wrangler d1 create pathagon-web
            npx wrangler d1 list --json > "$d1_list"
            database_id="$(jq -r '.[] | select(.name == "pathagon-web") | (.uuid // .id // empty)' "$d1_list" | head -n 1)"
          fi

          test -n "$database_id"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Configure production database
        working-directory: apps/web
        run: node scripts/configure-cloudflare-deploy.mjs "${{ steps.database.outputs.database_id }}"

      - name: Apply database migrations
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:remote

      - name: Deploy production Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: npm run deploy
