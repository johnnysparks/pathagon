name: Rust engine

on:
  pull_request:
    paths:
      - "pathagon/engine-rs/**"
      - "pathagon/contracts/**"
      - "data/**"
      - "research/**"
      - ".github/workflows/rust-engine.yml"
  push:
    branches: [master]
    paths:
      - "pathagon/engine-rs/**"
      - "pathagon/contracts/**"
      - "data/**"
      - "research/**"
      - ".github/workflows/rust-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathagon/engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash ../../scripts/check-data-policy.sh
      - run: cargo test --all-targets --release -j1
      - run: cargo run --release --bin pathagon-selfplay -- --games 2 --depth 2 --nodes 12000 --max-plies 80
      - name: Verify held-out trainer
        run: |
          cargo run --release --bin pathagon-train -- --generations 1 --population 2 --training-pairs 1 --evaluation-pairs 1 --depth 1 --nodes 500 --beam 20 --max-plies 50 --out /tmp/pathagon-training
          test -s /tmp/pathagon-training/report.json
          test -s /tmp/pathagon-training/champion.json
      - name: Verify persistent corpus round trip
        run: |
          cargo run --release --bin pathagon-selfplay -- --games 4 --seed 20260823 --depth 2 --nodes 12000 --max-plies 80 --corpus /tmp/pathagon-corpus
          cargo run --release --bin pathagon-selfplay -- --games 4 --seed 20260823 --depth 2 --nodes 12000 --max-plies 80 --corpus /tmp/pathagon-corpus
          test "$(grep -cv '^#' /tmp/pathagon-corpus/games.tsv)" -eq 4
      - name: Generate first held-out evolution run
        run: cargo run --release --bin pathagon-train -- --generations 1 --population 4 --training-pairs 4 --evaluation-pairs 8 --depth 2 --nodes 12000 --beam 49 --max-plies 120 --opening-random-plies 4 --out /tmp/pathagon-training
