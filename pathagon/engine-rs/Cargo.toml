[package]
name = "pathagon-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic headless Pathagon rules, search, and self-play engine"

[lib]
name = "pathagon_engine"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
inference = ["dep:getrandom", "dep:tract", "getrandom/wasm_js"]
lambda = ["inference", "dep:lambda_runtime", "dep:tokio"]
wasm = ["dep:js-sys", "dep:wasm-bindgen"]
wasm-inference = ["wasm", "inference"]

[[bin]]
name = "pathagon-selfplay"
path = "src/main.rs"

[[bin]]
name = "pathagon-train"
path = "src/train_main.rs"

[[bin]]
name = "pathagon-learn"
path = "src/learn_main.rs"

[[bin]]
name = "pathagon-endgame-frontier"
path = "src/bin/endgame_frontier.rs"

[[bin]]
name = "pathagon-endgame-tablebase"
path = "src/bin/endgame_tablebase.rs"

[[bin]]
name = "pathagon-endgame-oracle"
path = "src/bin/endgame_oracle.rs"

[[bin]]
name = "pathagon-endgame-merge"
path = "src/bin/endgame_merge.rs"

[[bin]]
name = "pathagon-endgame-expand"
path = "src/bin/endgame_expand.rs"

[[bin]]
name = "pathagon-endgame-compact"
path = "src/bin/endgame_compact.rs"

[[bin]]
name = "pathagon-endgame-slice"
path = "src/bin/endgame_slice.rs"

[[bin]]
name = "pathagon-endgame-promote"
path = "src/bin/endgame_promote.rs"

[[bin]]
name = "pathagon-endgame-gold-export"
path = "src/bin/endgame_gold_export.rs"

[[bin]]
name = "pathagon-endgame-match"
path = "src/bin/endgame_match.rs"

[[bin]]
name = "pathagon-jepa-export"
path = "src/bin/jepa_export.rs"

[[bin]]
name = "pathagon-lambda-worker"
path = "src/lambda_worker.rs"
required-features = ["lambda"]

[[bin]]
name = "pathagon-qadv-evaluator"
path = "src/lambda_evaluator.rs"
required-features = ["lambda"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
js-sys = { version = "0.3", optional = true }
tract = { package = "tract-onnx", version = "0.23.4", default-features = false, optional = true }
getrandom = { version = "0.4.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
lambda_runtime = { version = "1.3.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
